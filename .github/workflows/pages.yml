name: Test, derleme ve yayın

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test et ve derle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Birim testleri
        run: npm test

      - name: Derle
        run: npm run build

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Tarayıcı testleri
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python tests/e2e.py

      - name: Pages ayarlarını oku
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Site dosyalarını yükle
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: GitHub Pages'e yayınla
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
